# =============================================================================
# Logstash Pipeline Configuration
# =============================================================================
# Lee logs exportados por el OTel Collector (file exporter) y los indexa en ES.
# El file exporter escribe JSON Lines (una línea JSON por batch de exportación).
# Cada línea tiene formato OTLP: {"resourceLogs":[{resource, scopeLogs:[{logRecords}]}]}
# Este pipeline:
#   1. Lee cada línea como texto plano
#   2. Parsea el JSON
#   3. Extrae service.name, severityText, body, traceId, spanId de la estructura OTLP
#   4. Indexa cada registro individual en Elasticsearch
# =============================================================================

input {
  file {
    path => "/var/log/otel-collector.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  # 1. Parsear la línea JSON del file exporter (formato OTLP JSON)
  json {
    source => "message"
    tag_on_failure => ["_jsonparsefailure"]
  }

  # 2. Expandir cada logRecord en un evento separado usando split
  #    Primero aplanamos todos los records en un array temporal
  ruby {
    code => '
      begin
        resource_logs = event.get("resourceLogs")
        next unless resource_logs.is_a?(Array)

        all_records = []

        resource_logs.each do |rl|
          # Extraer atributos del resource (service.name, environment, etc.)
          service_name = nil
          environment  = nil
          attrs = rl.dig("resource", "attributes")
          if attrs.is_a?(Array)
            attrs.each do |attr|
              case attr["key"]
              when "service.name"
                service_name = attr.dig("value", "stringValue")
              when "deployment.environment"
                environment = attr.dig("value", "stringValue")
              end
            end
          end

          scope_logs = rl["scopeLogs"] || []
          scope_logs.each do |sl|
            records = sl["logRecords"] || []
            records.each do |rec|
              entry = {}
              entry["service_name"]  = service_name if service_name
              entry["environment"]   = environment  if environment
              entry["severity_text"] = rec["severityText"] if rec["severityText"]
              entry["severity_num"]  = rec["severityNumber"].to_i if rec["severityNumber"]

              trace_id = rec["traceId"]
              entry["trace_id"] = trace_id if trace_id && !trace_id.empty?

              span_id = rec["spanId"]
              entry["span_id"] = span_id if span_id && !span_id.empty?

              body = rec.dig("body", "stringValue")
              entry["body"] = body if body

              time_nano = rec["timeUnixNano"]
              if time_nano
                entry["time_ms"] = time_nano.to_s.to_i / 1_000_000
              end

              log_attrs = rec["attributes"] || []
              log_attrs.each do |la|
                key = la["key"]
                val = la.dig("value", "stringValue") ||
                      la.dig("value", "intValue").to_s ||
                      la.dig("value", "boolValue").to_s
                entry["attr_#{key}"] = val if key && !val.to_s.empty?
              end

              all_records << entry
            end
          end
        end

        event.set("_log_records", all_records)
      rescue => e
        event.tag("_ruby_exception: #{e.message}")
      end
    '
  }

  # Eliminar eventos sin records
  if ![_log_records] {
    drop { }
  }

  # 3. Dividir en un evento por logRecord
  split {
    field => "_log_records"
  }

  # 4. Promover campos del record al nivel superior del evento
  ruby {
    code => '
      rec = event.get("_log_records")
      next unless rec.is_a?(Hash)

      event.set("[service][name]", rec["service_name"]) if rec["service_name"]
      event.set("[deployment][environment]", rec["environment"]) if rec["environment"]
      event.set("[log][level]", rec["severity_text"]) if rec["severity_text"]
      event.set("severityNumber", rec["severity_num"]) if rec["severity_num"]
      event.set("traceId", rec["trace_id"]) if rec["trace_id"]
      event.set("spanId", rec["span_id"]) if rec["span_id"]
      event.set("Body", rec["body"]) if rec["body"]
      event.set("log_timestamp_ms", rec["time_ms"]) if rec["time_ms"] && rec["time_ms"] > 0

      rec.each do |k, v|
        if k.start_with?("attr_")
          attr_name = k[5, k.length]
          event.set("[logAttributes][#{attr_name}]", v)
        end
      end
    '
  }

  # 5. Convertir timestamp del log a @timestamp
  if [log_timestamp_ms] {
    date {
      match => ["log_timestamp_ms", "UNIX_MS"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  # 6. Limpiar campos temporales
  mutate {
    remove_field => ["message", "resourceLogs", "_log_records", "log_timestamp_ms"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "otel-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
