# Grafana Dashboard Provisioning
# Carga automáticamente los dashboards desde el directorio configurado

apiVersion: 1

providers:
  - name: 'FutureX Observability'
    orgId: 1
    folder: 'FutureX'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
